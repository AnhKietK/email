<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Murach's Java Servlets and JSP</title>
    <link rel="stylesheet" href="styles/main.css" type="text/css" />
</head>

<body>
    <img src="images/logo.jpg" alt="Murach Logo">
    
    <h1>Survey</h1>
    <p>If you have a moment, we'd appreciate it if you would fill out this survey.</p>

    <h2>Your information:</h2>

    <form action="emailList" method="post">
        <input type="hidden" name="action" value="add">

        <label class="pad_bottom">First Name</label>
        <input type="text" name="firstName" required><br>

        <label class="pad_bottom">Last Name</label>
        <input type="text" name="lastName" required><br>

        <label class="pad_bottom">Email</label>
        <input type="email" name="email" required><br>

        <label class="pad_bottom">Date of Birth</label>
        <input type="date" name="dateOfBirth" required><br>

        <h2>How did you hear about us?</h2>

        <label class="inline">
            <input type="radio" name="source" value="search_engine" checked> Search engine
        </label>
        <label class="inline">
            <input type="radio" name="source" value="word_of_mouth"> Word of mouth
        </label>
        <label class="inline">
            <input type="radio" name="source" value="social_media"> Social Media
        </label>
        <label class="inline">
            <input type="radio" name="source" value="other"> Other
        </label> <br>

        <h2>Would you like to receive announcements<br>about new CDs and special offers?</h2>

        <label class="inline block">
            <input type="checkbox" name="announcements" value="yes_announcements"> YES, I'd like that.
        </label><br>

        <label class="inline block">
            <input type="checkbox" name="offers" value="yes_offers"> YES, please send me special offers.
        </label><br><br>

        <label class="inline">Please contact me by: </label>
        <select name="contact_method">
            <option value="email_or_postal" selected>Email or postal mail</option>
            <option value="email_only">Email only</option>
            <option value="postal_only">Postal mail only</option>
        </select><br><br>

        <input type="submit" id="submit" value="Submit">
    </form>
</body>

</html>
